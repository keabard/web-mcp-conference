<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent — WebMCP Anywhere</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a; color: #e0e0f0; font-size: 13px;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #1a1a35 0%, #0f0f1a 100%);
      border-bottom: 1px solid #2a2a4a; flex-shrink: 0;
    }
    .header-icon { font-size: 20px; }
    .header h1 { font-size: 14px; font-weight: 600; color: #c0c0ff; letter-spacing: 0.3px; }
    .header p  { font-size: 11px; color: #6060a0; margin-top: 1px; }

    #log {
      flex: 1; overflow-y: auto; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 2px; }

    .msg { max-width: 92%; padding: 8px 11px; border-radius: 8px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .msg-user { align-self: flex-end; background: #1d2d4d; color: #cfe0ff; border: 1px solid #2a3f6a; }
    .msg-assistant { align-self: flex-start; background: #161628; color: #d8d8f0; border: 1px solid #252545; }
    .msg-tool { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: #a0a0ff; }
    .msg-error { border-color: #5a1a1a; color: #ff8080; }
    .msg-result { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; background: #0d1a2d; border-color: #1a3a5a; color: #bfe0ff; }

    .composer {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid #1e1e38; flex-shrink: 0;
    }
    #input {
      flex: 1; resize: none; height: 40px; max-height: 120px;
      background: #161628; color: #e0e0f0; border: 1px solid #252545;
      border-radius: 6px; padding: 9px 11px; font-size: 13px; font-family: inherit;
    }
    #input:focus { outline: none; border-color: #3a3a70; }
    #send {
      background: #2a2a5a; color: #c0c0ff; border: 1px solid #3a3a70;
      border-radius: 6px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #send:hover { background: #34346a; }
    #send:disabled { opacity: 0.5; cursor: default; }

    #status {
      padding: 6px 16px; font-size: 11px; color: #6060a0;
      border-top: 1px solid #1e1e38; flex-shrink: 0; min-height: 26px;
    }
    .hint { color: #5050a0; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <h1>Agent local</h1>
      <p>Pilotez les tools WebMCP en langage naturel</p>
    </div>
  </div>

  <div id="log">
    <div class="msg msg-assistant">
      Demandez-moi une action sur la page — par exemple
      <span class="hint">« cherche un vol Paris → New York le 5 juillet »</span>.
      J'appelle le bon tool WebMCP injecté sur le site.
    </div>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="Votre demande…"></textarea>
    <button id="send">Envoyer</button>
  </div>

  <div id="status">Initialisation…</div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
