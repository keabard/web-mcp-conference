<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMCP Anywhere</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      min-height: 120px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      font-size: 13px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #1a1a35 0%, #0f0f1a 100%);
      border-bottom: 1px solid #2a2a4a;
    }

    .header-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 14px;
      font-weight: 600;
      color: #c0c0ff;
      letter-spacing: 0.3px;
    }

    .header-title p {
      font-size: 11px;
      color: #6060a0;
      margin-top: 1px;
    }

    /* Status row */
    .status-section {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e38;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .status-label {
      color: #8080b0;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-green  { background: #0d2d0d; color: #4cff84; border: 1px solid #1a5a1a; }
    .badge-red    { background: #2d0d0d; color: #ff6060; border: 1px solid #5a1a1a; }
    .badge-yellow { background: #2d2000; color: #ffc840; border: 1px solid #5a4000; }
    .badge-gray   { background: #1a1a2e; color: #8080b0; border: 1px solid #2a2a4a; }
    .badge-blue   { background: #0d1a2d; color: #60a8ff; border: 1px solid #1a3a5a; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Tools section */
    .tools-section {
      padding: 10px 16px 14px;
    }

    .tools-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .tools-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5050a0;
    }

    .tools-count {
      font-size: 11px;
      color: #4cff84;
      font-weight: 600;
    }

    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
    }

    .tools-list::-webkit-scrollbar {
      width: 4px;
    }

    .tools-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .tools-list::-webkit-scrollbar-thumb {
      background: #2a2a5a;
      border-radius: 2px;
    }

    .tool-card {
      background: #161628;
      border: 1px solid #252545;
      border-radius: 6px;
      padding: 8px 10px;
      transition: border-color 0.15s;
    }

    .tool-card:hover {
      border-color: #3a3a70;
    }

    .tool-name {
      font-size: 12px;
      font-weight: 600;
      color: #a0a0ff;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tool-desc {
      font-size: 11px;
      color: #6060a0;
      margin-top: 3px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tool-auto-badge {
      display: inline-block;
      font-size: 10px;
      background: #1a1a0d;
      color: #ffc840;
      border: 1px solid #3a3a00;
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Empty / loading states */
    .state-message {
      padding: 20px 16px;
      text-align: center;
      color: #5050a0;
      font-size: 12px;
      line-height: 1.6;
    }

    .state-message strong {
      display: block;
      font-size: 13px;
      color: #8080c0;
      margin-bottom: 6px;
    }

    .state-message code {
      font-size: 10px;
      background: #1a1a2e;
      padding: 2px 5px;
      border-radius: 3px;
      color: #6060ff;
    }

    /* Footer */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #1e1e38;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-site {
      font-size: 11px;
      color: #4040808;
    }

    .btn-refresh {
      background: none;
      border: 1px solid #2a2a5a;
      color: #6060a0;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-refresh:hover {
      border-color: #5050a0;
      color: #a0a0ff;
    }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      color: #6060a0;
      font-size: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #2a2a5a;
      border-top-color: #6060ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">🔌</span>
    <div class="header-title">
      <h1>WebMCP Anywhere</h1>
      <p>Injecteur de tools pour agents IA</p>
    </div>
  </div>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <span>Lecture de l'état de la page…</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
